<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>NordNeuron Icon</title>
  <desc>NordNeuron neural hexagon icon mark</desc>

  <rect width="64" height="64" rx="14" fill="#080e14"/>

  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Hex outline -->
  <polygon points="32,8 54,20 54,44 32,56 10,44 10,20"
           fill="none" stroke="#1a3040" stroke-width="1.3"/>

  <!-- Neural edges -->
  <line x1="32" y1="14" x2="32" y2="32" stroke="#00c8f0" stroke-width="1.1" opacity="0.55"/>
  <line x1="32" y1="32" x2="48" y2="41" stroke="#00c8f0" stroke-width="1.1" opacity="0.55"/>
  <line x1="32" y1="32" x2="16" y2="41" stroke="#00c8f0" stroke-width="1.1" opacity="0.55"/>
  <line x1="48" y1="23" x2="32" y2="32" stroke="#00c8f0" stroke-width="1.1" opacity="0.55"/>
  <line x1="16" y1="23" x2="32" y2="32" stroke="#00c8f0" stroke-width="1.1" opacity="0.55"/>

  <!-- Outer nodes -->
  <circle cx="32" cy="14" r="3.5" fill="#080e14" stroke="#00c8f0" stroke-width="1.3"/>
  <circle cx="48" cy="23" r="3.5" fill="#080e14" stroke="#00c8f0" stroke-width="1.3"/>
  <circle cx="48" cy="41" r="3.5" fill="#080e14" stroke="#00c8f0" stroke-width="1.3"/>
  <circle cx="32" cy="50" r="3.5" fill="#080e14" stroke="#00c8f0" stroke-width="1.3"/>
  <circle cx="16" cy="41" r="3.5" fill="#080e14" stroke="#00c8f0" stroke-width="1.3"/>
  <circle cx="16" cy="23" r="3.5" fill="#080e14" stroke="#00c8f0" stroke-width="1.3"/>

  <!-- Center node -->
  <circle cx="32" cy="32" r="7.5" fill="#00c8f0" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="3.8" fill="#080e14"/>
</svg>
