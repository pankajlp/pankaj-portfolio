<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>NordNeuron Favicon</title>
  <desc>NordNeuron favicon — neural hexagon mark on transparent background</desc>

  <!-- Hex outline -->
  <polygon points="16,2 28,9 28,23 16,30 4,23 4,9"
           fill="none" stroke="#1a3040" stroke-width="1"/>

  <!-- Neural edges -->
  <line x1="16" y1="5"  x2="16" y2="16" stroke="#00c8f0" stroke-width="0.9" opacity="0.6"/>
  <line x1="16" y1="16" x2="25" y2="21" stroke="#00c8f0" stroke-width="0.9" opacity="0.6"/>
  <line x1="16" y1="16" x2="7"  y2="21" stroke="#00c8f0" stroke-width="0.9" opacity="0.6"/>
  <line x1="25" y1="11" x2="16" y2="16" stroke="#00c8f0" stroke-width="0.9" opacity="0.6"/>
  <line x1="7"  y1="11" x2="16" y2="16" stroke="#00c8f0" stroke-width="0.9" opacity="0.6"/>

  <!-- Outer nodes -->
  <circle cx="16" cy="5"  r="2" fill="#080e14" stroke="#00c8f0" stroke-width="1"/>
  <circle cx="25" cy="11" r="2" fill="#080e14" stroke="#00c8f0" stroke-width="1"/>
  <circle cx="25" cy="21" r="2" fill="#080e14" stroke="#00c8f0" stroke-width="1"/>
  <circle cx="16" cy="27" r="2" fill="#080e14" stroke="#00c8f0" stroke-width="1"/>
  <circle cx="7"  cy="21" r="2" fill="#080e14" stroke="#00c8f0" stroke-width="1"/>
  <circle cx="7"  cy="11" r="2" fill="#080e14" stroke="#00c8f0" stroke-width="1"/>

  <!-- Center node -->
  <circle cx="16" cy="16" r="4.5" fill="#00c8f0"/>
  <circle cx="16" cy="16" r="2.2" fill="#080e14"/>
</svg>
